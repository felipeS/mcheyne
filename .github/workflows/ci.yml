name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create LocalDevelopment.xcconfig for CI
      run: |
        echo "// CI Configuration - temporary file for automated builds" > LocalDevelopment.xcconfig
        echo "DEVELOPMENT_TEAM = " >> LocalDevelopment.xcconfig
        echo "CODE_SIGNING_ALLOWED = NO" >> LocalDevelopment.xcconfig
        echo "CODE_SIGN_IDENTITY = \"\"" >> LocalDevelopment.xcconfig
        echo "CODE_SIGNING_REQUIRED = NO" >> LocalDevelopment.xcconfig
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Show available simulators
      run: xcrun simctl list devices available
      
    - name: Cache derived data
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.swift', '**/*.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-
      
    - name: Run tests
      run: |
        set -o pipefail
        xcodebuild \
          -project "The M'Cheyne Plan.xcodeproj" \
          -scheme "The M'Cheyne PlanTests" \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
          -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
          -resultBundlePath TestResults.xcresult \
          test \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO | xcpretty
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults.xcresult
        retention-days: 7
        
  build:
    name: Build App
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create LocalDevelopment.xcconfig for CI
      run: |
        echo "// CI Configuration - temporary file for automated builds" > LocalDevelopment.xcconfig
        echo "DEVELOPMENT_TEAM = " >> LocalDevelopment.xcconfig
        echo "CODE_SIGNING_ALLOWED = NO" >> LocalDevelopment.xcconfig
        echo "CODE_SIGN_IDENTITY = \"\"" >> LocalDevelopment.xcconfig
        echo "CODE_SIGNING_REQUIRED = NO" >> LocalDevelopment.xcconfig
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
    - name: Cache derived data
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-build-derived-data-${{ hashFiles('**/*.swift', '**/*.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-build-derived-data-
      
    - name: Build for iOS
      run: |
        set -o pipefail
        xcodebuild \
          -project "The M'Cheyne Plan.xcodeproj" \
          -scheme "The M'Cheyne Plan" \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
          -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
          build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO | xcpretty
      
    - name: Build for macOS
      run: |
        set -o pipefail
        xcodebuild \
          -project "The M'Cheyne Plan.xcodeproj" \
          -scheme "The M'Cheyne Plan" \
          -destination 'platform=macOS' \
          -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
          build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO | xcpretty
